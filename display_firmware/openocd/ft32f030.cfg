# OpenOCD config for the FMD FT32F030C8 scooter display MCU (STM32F030 clone)
# over an ST-Link (HLA SWD).
#
# There is intentionally NO flash driver: OpenOCD's stm32f0x driver does not
# recognise this clone. Reads use the AHB-AP directly; writes are done by
# flash_blocks.tcl with the register sequence copied from the display
# firmware's own flash HAL (0x08000420..0x08000590).
#
# Optional (set with -c before -f):
#   USE_SRST 1   NRST is wired to the ST-Link -> use hardware reset

source [find interface/stlink.cfg]
transport select hla_swd
# Conservative clock: cheap ST-Link clones + flying wires.
adapter speed 480

source [find target/swj-dp.tcl]

set _CHIPNAME ft32f030
swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
	-expected-id 0x0bb11477 -expected-id 0x0bc11477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian little -dap $_CHIPNAME.dap
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x800 -work-area-backup 0

$_TARGETNAME configure -event halted {
	# Freeze IWDG & WWDG counter in DBGMCU so watchdog does not reset MCU while halted
	catch { mww 0x40015808 0x00001800 }
	catch { mww 0x40003000 0xAAAA }
}


if { [info exists USE_SRST] && $USE_SRST } {
	reset_config srst_only srst_nogate
	adapter srst delay 100
} else {
	# Software reset (SYSRESETREQ) through the ST-Link.
	reset_config none
}
